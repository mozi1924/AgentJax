[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Keep this in sync with `src-tauri/rust-toolchain.toml` so local builds and
# CI agree on the minimum supported compiler for the desktop runtime.
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
dirs = "6"
log = "0.4.30"
# Reqwest 0.13 renamed its Rustls integration feature from `rustls-tls` to
# `rustls`, so keep the transport surface explicit while staying on Rustls.
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "1.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
notify = "8.2.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
statrs = { version = "0.18", default-features = false }
file-format = { version = "0.29.0", features = ["reader"] }
thales = "0.4.3"
fend-core = "1.5.8"
num-rational = "0.4.2"
